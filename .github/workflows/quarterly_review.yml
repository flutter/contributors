name: Quarterly Ladder Review

on:
  schedule:
    # 03:17 UTC on the 1st of January, April, July, and October (Quarterly Kickoff, offset from top of hour)
    - cron: '17 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not file issues)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: quarterly-review
  cancel-in-progress: false

jobs:
  file_checklist:
    name: File Quarterly Review Checklist Issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File Quarterly Review Checklist Issue for @Piinks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          QUARTER="Q$(( ($(date +%-m) - 1) / 3 + 1 )) $(date +%Y)"
          QUARTER_SLUG="$(date +%Y)-Q$(( ($(date +%-m) - 1) / 3 + 1 ))"

          cat <<EOF > checklist_body.md
          # Quarterly Contributor Ladder Review Checklist (${QUARTER})

          This issue tracks the facilitator tasks for the **${QUARTER}** Flutter Contributor Ladder review.
          See [docs/QUARTERLY_REVIEW.md](docs/QUARTERLY_REVIEW.md) for full details.

          ## Phase 1: Kickoff & Opening the Review PR (Day 1)

          - [ ] **1. Run the audit locally & vet against the internal ban history list**
            Pull the latest \`main\` branch (with daily synced activity data), create a branch for the quarterly review PR, and run:

            \`\`\`bash
            git checkout -b ${QUARTER_SLUG}-quarterly-review
            dart run tool/quarterly_audit.dart --prepare
            \`\`\`

            - The tool lists all nominated promotions, returning Emeriti, and prospective external new joiners so you can manually check those usernames against the internal Code of Conduct / ban history list.
            - Enter any ineligible usernames when prompted (or pass \`--exclude user1,user2\`) so they are excluded before any files are written and no one is singled out.
            - This generates \`reports/${QUARTER_SLUG}-community-ladder-audit.md\` and \`reports/${QUARTER_SLUG}-partner-verification-audit.md\` and updates \`data/contributors.yaml\`, \`ROSTER.md\`, and \`EMERITUS.md\`.
          - [ ] **2. Open the single Quarterly Review PR (do not merge until after 30-day grace period)**
            Commit the generated reports and roster updates into a single PR:

            \`\`\`bash
            git add reports/ data/contributors.yaml ROSTER.md EMERITUS.md
            git commit -m "chore: ${QUARTER} quarterly contributor ladder review"
            \`\`\`

            *(Hold this PR open throughout the 30-day review period.)*
          - [ ] **3. Open the public Community Review & Partner Verification issues**
            Use the tool to draft or open the two public tracking issues from your vetted reports to start the 30-day review period:

            \`\`\`bash
            # Preview drafted issues and gh commands:
            dart run tool/quarterly_audit.dart --draft-issues --pr <PR_URL>

            # Or open both issues directly via gh CLI:
            dart run tool/quarterly_audit.dart --open-issues --pr <PR_URL>
            \`\`\`

          ## Phase 2: 30-Day Review Period (Days 1–30)

          - [ ] **4. Monitor community responses & confirm partner members**
            - Collect Discord usernames from newly invited contributors on the Community Audit issue.
            - Review qualitative contributions that cannot be quantified automatically (triage, reproductions, [RFCs](https://github.com/flutter/rfc), mentoring).
            - Reach out to partner teams to confirm active status for \`@flutter/partners\` members.
            - *(The weekly \`.github/workflows/check_grace_period.yml\` workflow automatically posts a weekly countdown update on the open review issues during the 30-day window and pings the assignee once 30 days have elapsed.)*

          ## Phase 3: Finalization & Provisioning (Day 30+)

          - [ ] **5. Update the open PR with 30-day adjustments & land it**
            On your \`${QUARTER_SLUG}-quarterly-review\` PR branch, run the tool with any adjustments from the 30-day window:

            \`\`\`bash
            dart run tool/quarterly_audit.dart --finalize \\
              --retain user1,user2 \\
              --exclude declined_or_excluded_user \\
              --discord new_user=discord_handle
            \`\`\`

            Commit, push to the PR branch, and merge the PR.
          - [ ] **6. Synchronize GitHub teams, Discord access & close issues**
            - Update \`@flutter/reviewers\`, \`@flutter/committers\`, and \`@flutter/maintainers\` (child teams of \`@flutter/flutter-hackers\`, where \`@flutter/maintainers\` contains all members of \`@flutter/googlers\` and \`@flutter/partners\`) and \`@flutter/partners\` child teams to match \`ROSTER.md\` (\`@flutter/collaborators\` is automatically managed by internal tooling and is not updated manually).
            - Remove members who transitioned to Dasher Emeritus from the \`flutter\` GitHub organization.
            - Grant the Discord team member role to newly added ladder members using their collected Discord handles.
            - Close the public review issues and this checklist issue.
          EOF

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Would file checklist issue:"
            cat checklist_body.md
            exit 0
          fi

          gh label create "quarterly-review-checklist" --description "Quarterly Review Facilitator Checklist" --color "0052CC" --force || true

          EXISTING_CHECKLIST=$(gh issue list --state all --label "quarterly-review-checklist" --search "${QUARTER}" --json number --jq '.[0].number')
          if [ -z "$EXISTING_CHECKLIST" ]; then
            CHECKLIST_URL=$(gh issue create \
              --title "[Quarterly Review Checklist]: ${QUARTER} Contributor Ladder Audit" \
              --body-file checklist_body.md \
              --label "quarterly-review-checklist" \
              --assignee "Piinks")
            echo "Created Quarterly Review Checklist Issue: $CHECKLIST_URL"
          else
            echo "Quarterly Review Checklist Issue already exists (#$EXISTING_CHECKLIST)."
          fi
